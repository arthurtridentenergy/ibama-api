services:
  - type: web
    name: ibama
    env: python
    plan: free
    pythonVersion: 3.12
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: CLIENT_ID
        value: ibama_client
      - key: CLIENT_SECRET
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
