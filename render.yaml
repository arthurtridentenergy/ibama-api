services:
  - type: web
    name: ibama
    env: python
    plan: free
    pythonVersion: 3.12
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1"
    healthCheckPath: /health
    envVars:
      - key: CLIENT_ID
        value: ibama_client_id
      - key: CLIENT_SECRET
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: ENVIRONMENT
        value: production
      - key: SPINERGIE_BASE_URL
        value: https://trident-energy-br.spinergie.com
      # NÃO usar generateValue aqui — precisa ser a chave REAL fornecida pela
      # Spinergie. Defina o valor manualmente no dashboard do Render
      # (Environment) após o primeiro deploy; sync: false evita que um novo
      # `render blueprint sync` sobrescreva o valor com algo em branco.
      - key: SPINERGIE_API_KEY
        sync: false
      # Chave DEDICADA ao endpoint /sd/api/vessel/sfm-latest-locations
      # (última posição das embarcações). Confirmado pela Spinergie que essa
      # chave é diferente da chave geral acima (que cobre POIs e demais
      # endpoints, mas NÃO tem permissão para posições de embarcações).
      # Gere essa chave na aba "API Keys" do painel da Spinergie e cole o
      # valor aqui no dashboard do Render (Environment).
      - key: SPINERGIE_VESSEL_API_KEY
        sync: false
